# Production-hardened compose file, meant to be hosted as a Coolify
# "Docker Compose" resource (Base Directory: web). This is the
# staging/production counterpart to docker-compose.yml, which stays
# focused on local development — see web/README.md for the local setup
# and the full Coolify deployment walkthrough (bucket creation, migrate,
# admin:create), which applies here unchanged.
#
# What's different from docker-compose.yml:
#   - A separate Compose project name (`AbedLive-staging`) so this
#     stack's containers, network and volumes never collide with another
#     stack (e.g. a real `production` deploy) on the same Docker host.
#   - Postgres credentials come from environment variables you set in
#     Coolify's UI (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB)
#     instead of the committed `changeme` dev default — the app and
#     migrate services build DATABASE_URL from the same variables, so
#     there's exactly one place to change the password.
#   - Every long-running service gets a health check, a memory/CPU
#     ceiling, rotated JSON logging (so a runaway container can't fill
#     the host's disk), and `no-new-privileges` as a baseline hardening
#     default.
#   - `app` and `migrate` already build through the same multi-stage,
#     `output: standalone` Dockerfile used locally (non-root user,
#     production `next build`); the image also carries its own
#     HEALTHCHECK now, which `docker ps` / Coolify picks up directly.
#   - `seaweedfs`'s S3 identity config is generated at container start
#     from S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY (docker/seaweedfs-
#     entrypoint.sh) instead of being a static file with real keys
#     committed to the repo.
#   - `app` and `seaweedfs` use `expose:`, not `ports:` — Traefik (which
#     Coolify uses) reaches containers over the internal Docker network
#     and never needs a host-published port; `ports:` is explicitly for
#     bypassing the proxy, per Coolify's own docs. Domain routing for a
#     Docker Compose resource is instead wired by a `SERVICE_FQDN_<ID>_
#     <PORT>` env var declared on the service (Coolify scans for it) —
#     that's what was actually missing before, not the ports/expose
#     choice. `postgres`, internal-only, gets neither.
#   - `migrate` is profile-gated ("tools"), run manually per deploy —
#     see web/README.md. NOT wired into `up`/app's depends_on: Coolify's
#     Compose healthcheck monitor currently misreads a one-off job that
#     exits(0) as "a service went down" and stops the whole stack in
#     response (open upstream bug, coollabsio/coolify#7115) — that's
#     what broke every deploy after auto-migrate-on-boot was added here.
#
# Required environment variables (set these in Coolify, then redeploy):
# POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, plus everything already
# listed in web/README.md (BETTER_AUTH_SECRET, BETTER_AUTH_URL, S3_*).

name: AbedLive-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abedlive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Coolify's environment variables}
      POSTGRES_DB: ${POSTGRES_DB:-abedlive}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abedlive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker/seaweedfs-entrypoint.sh"]
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.port=8333
    env_file: .env
    environment:
      # Wires this service's domain for Coolify's Compose-resource
      # routing — see the header comment. Must be a real env var here
      # (not just set in Coolify's UI) for a Docker Compose resource.
      SERVICE_FQDN_SEAWEEDFS_8333: abedmedia.omerohmlabs.com
    volumes:
      - seaweed_data:/data
      - ./docker/seaweedfs-entrypoint.sh:/docker/seaweedfs-entrypoint.sh:ro
    expose:
      - "8333"
    healthcheck:
      # Hits the master's built-in status page (always on, no auth) —
      # not the S3 API itself, since that 403s without credentials.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-off — see web/README.md for `docker compose run --rm migrate`.
  # Excluded from normal startup by the "tools" profile: not part of
  # the monitored stack, so a one-off exit(0) can't be misread as the
  # whole resource going unhealthy (see header comment).
  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-abedlive}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Coolify's environment variables}@postgres:5432/${POSTGRES_DB:-abedlive}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run db:migrate"
    profiles: ["tools"]
    mem_limit: 512m
    cpus: "1.0"

  app:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-abedlive}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Coolify's environment variables}@postgres:5432/${POSTGRES_DB:-abedlive}
      S3_ENDPOINT: http://seaweedfs:8333
      # Wires this service's domain for Coolify's Compose-resource
      # routing — see the header comment.
      SERVICE_FQDN_APP_3000: abedlive.omerohmlabs.com
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  seaweed_data:
