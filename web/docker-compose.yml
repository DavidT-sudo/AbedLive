name: AbedLive

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abedlive
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: abedlive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abedlive"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker/seaweedfs-entrypoint.sh"]
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.port=8333
    env_file: .env
    volumes:
      - seaweed_data:/data
      - ./docker/seaweedfs-entrypoint.sh:/docker/seaweedfs-entrypoint.sh:ro
    ports:
      # S3 API — expose only if the app runs outside this compose network too.
      - "8333:8333"

  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run db:seed"
    profiles: ["tools"]

  app:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://abedlive:changeme@postgres:5432/abedlive
      S3_ENDPOINT: http://seaweedfs:8333
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  seaweed_data:
